x-common: &common
  ulimits:
    nofile:
      soft: 1048576
      hard: 1048576
  restart: always
  networks:
    - remnawave-network

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 100m
      max-file: 5

x-env: &env
  env_file: .env

services:
  remnawave-subscription-page:
    image: sammosdev/remnawave-subscription-page:${IMAGE_TAG:-latest}
    container_name: remnawave-subscription-page
    hostname: remnawave-subscription-page
    <<: [*common, *logging, *env]
    restart: always
    ports:
      - '127.0.0.1:3010:3010'

networks:
  remnawave-network:
    external: true