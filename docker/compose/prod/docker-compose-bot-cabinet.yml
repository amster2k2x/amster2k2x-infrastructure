x-common: &common
  ulimits:
    nofile:
      soft: 1048576
      hard: 1048576
  restart: always
  networks:
    - remnawave-network

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 100m
      max-file: 5

x-env: &env
  env_file: .env

x-remnawave-bot-account: &remnawave-bot-account
  image: sammosdev/remnawave-bedolaga-cabinet:${IMAGE_TAG:-latest}
  <<: [*common, *logging, *env]
  restart: unless-stopped
  volumes:
    - /opt/bot-cabinet/vite.svg:/usr/share/nginx/html/vite.svg:ro
    - /opt/bot-cabinet/heleket_ac20b019.html:/usr/share/nginx/html/heleket_ac20b019.html:ro
  healthcheck:
    test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
    interval: 30s
    timeout: 3s
    retries: 3
    start_period: 10s

services:
  remnawave-bot-account-blue:
    <<: *remnawave-bot-account
    container_name: remnawave-bot-account-blue
    hostname: remnawave-bot-account-blue
    ports:
      - "127.0.0.1:4080:80"

  remnawave-bot-account-green:
    <<: *remnawave-bot-account
    container_name: remnawave-bot-account-green
    hostname: remnawave-bot-account-green
    ports:
      - "127.0.0.1:4081:80"

networks:
  remnawave-network:
    name: remnawave-network
    driver: bridge
    external: true