x-common: &common
  ulimits:
    nofile:
      soft: 1048576
      hard: 1048576
  restart: always
  networks:
    - remnawave-network

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 100m
      max-file: 5

x-env: &env
  env_file: .env

x-remnawave-bot: &remnawave-bot
  image: sammosdev/remnawave-bedolaga-telegram-bot:${IMAGE_TAG:-latest}
  <<: [*common, *logging, *env]
  restart: unless-stopped
  depends_on:
    remnawave-bot-db:
      condition: service_healthy
    remnawave-bot-redis:
      condition: service_healthy
  environment:
    DOCKER_ENV: "true"
    DATABASE_MODE: "auto"
    POSTGRES_HOST: "remnawave-bot-db"
    POSTGRES_PORT: "5432"
    POSTGRES_DB: "${POSTGRES_DB}"
    POSTGRES_USER: "${POSTGRES_USER}"
    POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    REDIS_URL: "unix:///var/run/valkey/valkey.sock"
    TZ: "Europe/Moscow"
    LOCALES_PATH: "${LOCALES_PATH:-/app/locales}"
  volumes:
    - valkey-socket:/var/run/valkey
    - /opt/bot/logs:/app/logs:rw
    - /etc/timezone:/etc/timezone:ro
    - /etc/localtime:/etc/localtime:ro
    - /opt/bot/vpn_logo.png:/app/vpn_logo.png:ro
    - /opt/bot/uploads:/app/uploads:rw
  healthcheck:
    test:
      [
        'CMD-SHELL',
        'python -c "import requests, os; requests.get(''http://localhost:8080/health'', headers={''X-API-Key'': os.environ.get(''WEB_API_DEFAULT_TOKEN'')}, timeout=5) or exit(1)"',
      ]
    interval: 60s
    timeout: 10s
    retries: 3
    start_period: 30s

services:
  remnawave-bot-db:
    image: postgres:18.4
    container_name: remnawave-bot-db
    hostname: remnawave-bot-db
    restart: unless-stopped
    <<: [*common, *logging, *env]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  remnawave-bot-redis:
    image: valkey/valkey:9-alpine
    container_name: remnawave-bot-redis
    hostname: remnawave-bot-redis
    <<: [*common, *logging]
    restart: unless-stopped
    command: >
      valkey-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --unixsocket /var/run/valkey/valkey.sock
      --unixsocketperm 777
      --port 0
    volumes:
      - valkey-socket:/var/run/valkey
    healthcheck:
      test: ['CMD', 'valkey-cli', '-s', '/var/run/valkey/valkey.sock', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3

  remnawave-bot-blue:
    <<: *remnawave-bot
    container_name: remnawave-bot-blue
    hostname: remnawave-bot-blue
    ports:
      - "127.0.0.1:8080:8080"   # blue owns 8080

  remnawave-bot-green:
    <<: *remnawave-bot
    container_name: remnawave-bot-green
    hostname: remnawave-bot-green
    ports:
      - "127.0.0.1:8081:8080"   # green owns 8081 → container 8080

volumes:
  postgres-data:
    driver: local
  valkey-socket:
    driver: local

networks:
  remnawave-network:
    name: remnawave-network
    driver: bridge
    external: true