x-env: &env
  env_file: .env

services:
  remnanode:
    image: remnawave/node:${IMAGE_TAG:-latest}
    container_name: remnanode
    hostname: remnanode
    <<: *env
    network_mode: host
    restart: always
    cap_add:
      - NET_ADMIN
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    volumes:
      - /var/log/remnanode:/var/log/remnanode
      - /dev/shm:/dev/shm