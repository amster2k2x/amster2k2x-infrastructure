x-common: &common
  ulimits:
    nofile:
      soft: 1048576
      hard: 1048576
  restart: always
  networks:
    - remnawave-network

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 100m
      max-file: 5

x-env: &env
  env_file: .env

x-remnawave: &remnawave
    image: sammosdev/remnawave-backend:${IMAGE_TAG:-latest}
    <<: [*common, *logging, *env]
    volumes:
      - valkey-socket:/var/run/valkey
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:${METRICS_PORT:-3001}/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      remnawave-db:
        condition: service_healthy
      remnawave-redis:
        condition: service_healthy

services:
  remnawave-blue:
    <<: *remnawave
    container_name: remnawave-blue
    hostname: remnawave-blue
    ports:
      - 127.0.0.1:3000:3000    # blue always owns 3000
      - 127.0.0.1:3001:3001    # blue always owns 3001 for metrics

  remnawave-green:
    <<: *remnawave
    container_name: remnawave-green
    hostname: remnawave-green
    ports:
      - 127.0.0.1:3010:3000    # green always owns 3010 on host → 3000 in container
      - 127.0.0.1:3011:3001    # green always owns 3011 for metrics

  remnawave-db:
    image: postgres:18.4
    container_name: remnawave-db
    hostname: remnawave-db
    <<: [*common, *logging, *env]
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=UTC
    ports:
      - 127.0.0.1:6767:5432
    volumes:
      - remnawave-db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 3s
      timeout: 10s
      retries: 3

  remnawave-redis:
    image: valkey/valkey:9-alpine
    container_name: remnawave-redis
    hostname: remnawave-redis
    <<: [*common, *logging]
    volumes:
      - valkey-socket:/var/run/valkey
    command: >
      valkey-server
      --save ""
      --appendonly no
      --maxmemory-policy noeviction
      --loglevel warning
      --unixsocket /var/run/valkey/valkey.sock
      --unixsocketperm 777
      --port 0
    healthcheck:
      test: ['CMD', 'valkey-cli', '-s', '/var/run/valkey/valkey.sock', 'ping']
      interval: 3s
      timeout: 3s
      retries: 3

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    hostname: alloy
    <<: [*common, *logging, *env]
    restart: always
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    command:
      - run
      - /etc/alloy/config.alloy

networks:
  proxy:
    name: proxy
  remnawave-network:
    name: remnawave-network
    driver: bridge
    external: false

volumes:
  remnawave-db-data:
    name: remnawave-db-data
    driver: local
    external: false
  valkey-socket:
    name: valkey-socket
    driver: local
    external: false