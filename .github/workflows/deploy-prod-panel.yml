name: Deploy Panel to Prod (blue-green)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy'
        required: false
        default: 'latest'
  # Also callable after a successful build:
  workflow_call:
    inputs:
      image_tag:
        required: false
        type: string
        default: 'latest'

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-prod-apps-template.yml
    with:
      ssh_host_secret: PROD_PANEL_VPS_HOST
      service_name: remnawave
      display_name: Remnawave Panel
      compose_file: docker-compose.yml
      deploy_dir: /opt/remnawave
      container_port: '3000'
      blue_port: '3000'
      green_port: '3001'
      health_path: '/health'
      nginx_upstream_blue: 'remnawave-blue'
      nginx_upstream_green: 'remnawave-green'
      nginx_config_path: /opt/nginx/nginx.conf
      image_tag: ${{ inputs.image_tag || 'latest' }}
    secrets: inherit