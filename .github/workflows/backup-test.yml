name: Test environment - capture golden backup

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Which service to back up'
        required: true
        type: choice
        options:
          - panel
          - bot

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  CLUSTER: amster2k2x-test
  BUCKET_ENV: test

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Assume cicd-runner hub role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_HUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-hub

      - name: Assume test-account deploy role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-test-deploy
          role-chaining: true
          role-skip-session-tagging: true

      - name: Install Session Manager plugin
        run: |
          curl -sSO "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb"
          sudo dpkg -i session-manager-plugin.deb
          session-manager-plugin --version

      - name: Find running task
        id: task
        run: |
          TASK_ARN=$(aws ecs list-tasks \
            --cluster "$CLUSTER" \
            --service-name "${{ inputs.service }}" \
            --region "$AWS_REGION" \
            --query 'taskArns[0]' \
            --output text)

          if [ "$TASK_ARN" = "None" ] || [ -z "$TASK_ARN" ]; then
            echo "::error::No running task found for service '${{ inputs.service }}'. Is the test environment up?"
            exit 1
          fi

          echo "arn=$TASK_ARN" >> $GITHUB_OUTPUT

      - name: Dump and upload from inside the container
        run: |
          SVC="${{ inputs.service }}"
          TASK="${{ steps.task.outputs.arn }}"
          BUCKET="amster2k2x-${BUCKET_ENV}-golden-backups"

          # Both the dump AND the upload happen inside the container's own
          # shell, using its own task-role credentials. This never pipes
          # execute-command's noisy interactive stdout into the actual file —
          # that stream is unreliable (SSM banners, occasional mid-stream
          # errors) and corrupts anything piped through the runner.
          echo "Dumping and uploading (this may take ~15-20s for the aws-cli install)..."
          aws ecs execute-command \
            --cluster "$CLUSTER" \
            --task "$TASK" \
            --container postgres \
            --region "$AWS_REGION" \
            --interactive \
            --command "sh -c 'pg_dump --format=plain --clean --if-exists -U $SVC -d $SVC -f /tmp/$SVC.dump && apk add --no-cache aws-cli --quiet && aws s3 cp /tmp/$SVC.dump s3://$BUCKET/$SVC/latest.dump --region $AWS_REGION && echo BACKUP_UPLOAD_COMPLETE'"

      - name: Verify upload
        run: |
          SVC="${{ inputs.service }}"
          BUCKET="amster2k2x-${BUCKET_ENV}-golden-backups"
          aws s3 ls "s3://$BUCKET/$SVC/latest.dump"

          echo "Sanity-checking the dump has no execute-command pollution..."
          if aws s3 cp "s3://$BUCKET/$SVC/latest.dump" - | head -20 | grep -qi "session\|SessionId"; then
            echo "::error::Dump appears to contain SSM session text — something is still wrong."
            exit 1
          fi
          echo "::notice::Golden backup for $SVC saved to s3://$BUCKET/$SVC/latest.dump — looks clean."
