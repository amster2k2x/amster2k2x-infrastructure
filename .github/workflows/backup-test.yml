name: Test environment - manual backup

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Overwrites panel_latest.dump and bot_latest.dump. Type "yes" to proceed.'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: test
    defaults:
      run:
        working-directory: terraform/build
    steps:
      - name: Confirm intent
        if: inputs.confirm != 'yes'
        run: |
          echo "::error::Type 'yes' in the confirm field to overwrite the latest backups."
          exit 1

      - uses: actions/checkout@v4

      - name: Assume cicd-runner hub role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_HUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-hub

      - name: Assume test-account deploy role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-test-backup
          role-chaining: true
          role-skip-session-tagging: true

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=build/test/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true"
        env:
          TF_VAR_workload_account_state_bucket: ${{ secrets.TF_BOOTSTRAP_STATE_BUCKET }}

      - name: Run db-tools backup
        run: |
          TASK_DEF=$(terraform output -raw db_tools_task_definition_arn)
          SUBNETS=$(terraform output -json private_app_subnet_ids | jq -r 'join(",")')
          SG=$(terraform output -raw ecs_tasks_sg_id)

          TASK_ARN=$(aws ecs run-task \
            --cluster amster2k2x-test \
            --task-definition "$TASK_DEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"db-tools","command":["/scripts/backup.sh"]}]}' \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Backup task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster amster2k2x-test --tasks "$TASK_ARN"

          DETAILS=$(aws ecs describe-tasks \
            --cluster amster2k2x-test \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].{stopCode:stopCode,stoppedReason:stoppedReason,containers:containers[*].{name:name,exitCode:exitCode,reason:reason}}' \
            --output json)
          echo "$DETAILS"

          EXIT_CODE=$(echo "$DETAILS" | jq -r '.containers[0].exitCode')

          if [ "$EXIT_CODE" = "null" ] || [ "$EXIT_CODE" != "0" ]; then
            echo "::error::db-tools backup failed — exitCode: $EXIT_CODE"
            exit 1
          fi

      - name: Verify backups exist in S3
        run: |
          BUCKET=$(terraform output -raw backups_bucket_name)

          aws s3 ls "s3://${BUCKET}/panel_latest.dump" \
            && echo "panel_latest.dump ✓" \
            || { echo "::error::panel_latest.dump missing"; exit 1; }

          aws s3 ls "s3://${BUCKET}/bot_latest.dump" \
            && echo "bot_latest.dump ✓" \
            || { echo "::error::bot_latest.dump missing"; exit 1; }

      - name: Summary
        run: |
          BUCKET=$(terraform output -raw backups_bucket_name)
          echo "### Manual backup complete" >> $GITHUB_STEP_SUMMARY
          echo "| File | Bucket |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| panel_latest.dump | $BUCKET |" >> $GITHUB_STEP_SUMMARY
          echo "| bot_latest.dump   | $BUCKET |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "These will be restored on the next \`deploy-test.yml\` run." >> $GITHUB_STEP_SUMMARY