name: Test environment - capture golden backup

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Which service to back up'
        required: true
        type: choice
        options:
          - panel
          - bot

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  CLUSTER: amster2k2x-test
  BUCKET_ENV: test

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Assume cicd-runner hub role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_HUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-hub

      - name: Assume test-account deploy role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-test-deploy
          role-chaining: true
          role-skip-session-tagging: true

      - name: Install Session Manager plugin
        run: |
          curl -sSO "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb"
          sudo dpkg -i session-manager-plugin.deb
          session-manager-plugin --version

      - name: Find running task
        id: task
        run: |
          TASK_ARN=$(aws ecs list-tasks \
            --cluster "$CLUSTER" \
            --service-name "${{ inputs.service }}" \
            --region "$AWS_REGION" \
            --query 'taskArns[0]' \
            --output text)

          if [ "$TASK_ARN" = "None" ] || [ -z "$TASK_ARN" ]; then
            echo "::error::No running task found for service '${{ inputs.service }}'. Is the test environment up?"
            exit 1
          fi

          echo "arn=$TASK_ARN" >> $GITHUB_OUTPUT

      - name: Dump directly from container to runner and upload
        run: |
          SVC="${{ inputs.service }}"
          TASK="${{ steps.task.outputs.arn }}"
          BUCKET="amster2k2x-${BUCKET_ENV}-golden-backups"

          echo "Streaming deep database backup from ECS to the runner..."
          
          # 1. Added '--schema=public' to explicitly target your application tables
          # 2. Added '--verbose' to help us see exactly what pg_dump is doing
          aws ecs execute-command \
            --cluster "$CLUSTER" \
            --task "$TASK" \
            --container postgres \
            --region "$AWS_REGION" \
            --interactive \
            --command "sh -c 'PGPASSWORD=\"test-only-not-secret\" pg_dump --format=plain --schema=public --clean --if-exists -U $SVC -d $SVC'" > /tmp/raw_backup.dump

          echo "Cleaning up AWS SSM terminal noise from the file..."
          sed -i '/Starting session\|SessionId\|Exiting session/d' /tmp/raw_backup.dump

          echo "Uploading clean file to S3..."
          aws s3 cp /tmp/raw_backup.dump "s3://$BUCKET/$SVC/latest.dump" --region "$AWS_REGION"

      - name: Verify upload
        run: |
          SVC="${{ inputs.service }}"
          BUCKET="amster2k2x-${BUCKET_ENV}-golden-backups"
          
          echo "Checking if file exists in S3..."
          aws s3 ls "s3://$BUCKET/$SVC/latest.dump"

          echo "Sanity-checking the dump file structure..."
          # Download the first 20 lines to make sure it looks like a real SQL dump
          FIRST_LINES=$(aws s3 cp "s3://$BUCKET/$SVC/latest.dump" - | head -20)
          
          if echo "$FIRST_LINES" | grep -qi "PostgreSQL database dump"; then
            echo "::notice::Success! Valid PostgreSQL dump detected."
          else
            echo "::error::Dump file does not look like a valid SQL backup."
            exit 1
          fi
