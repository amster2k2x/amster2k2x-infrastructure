name: "[reusable] Prod blue-green deploy"

on:
  workflow_call:
    inputs:
      ssh_host_secret:
        description: 'Name of the org secret holding the VPS hostname'
        required: true
        type: string
      service_name:
        description: 'Logical name: panel | bot'
        required: true
        type: string
      display_name:
        description: 'Human-readable name for Telegram notifications'
        required: true
        type: string
      compose_file:
        description: 'docker-compose file on the VPS (absolute path)'
        required: true
        type: string
      deploy_dir:
        description: 'Working directory on VPS that holds docker-compose + .env'
        required: true
        type: string
      container_port:
        description: 'Port the container listens on internally (3000, 8080, 80, etc.)'
        required: true
        type: string
      blue_port:
        description: 'Host port for blue slot'
        required: true
        type: string
      green_port:
        description: 'Host port for green slot'
        required: true
        type: string
      health_path:
        description: 'HTTP path for health check, e.g. /health'
        required: false
        type: string
        default: '/health'
      health_header:
        description: 'Optional header for health check, e.g. "X-API-Key: mytoken"'
        required: false
        type: string
        default: ''
      nginx_config_path:
        description: 'Absolute path to nginx site config on VPS'
        required: true
        type: string
      image_tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        type: string
        default: 'latest'

jobs:
  notify-start:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram — deploy started
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message_thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          format: html
          message: |
            🔄 <b>Prod Deploy Started</b>

            <b>Service:</b> ${{ inputs.display_name }}
            <b>Strategy:</b> Blue-Green
            <b>Trigger:</b> ${{ github.event_name }} by ${{ github.actor }}
            <b>Tag:</b> <code>${{ inputs.image_tag }}</code>

  blue-green-deploy:
    runs-on: ubuntu-latest
    environment: prod        # ← triggers approval gate + scopes secrets
    outputs:
      deployed_slot: ${{ steps.swap.outputs.deployed_slot }}
      rolled_back: ${{ steps.rollback.outputs.rolled_back }}
    steps:
      - name: Checkout gha-workflows (for scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install SSH key
        uses: webfactory/ssh-agent@dc588b651fe13d2e1f1c64f4e63c41e5e7e1aac4 # v0.9.1
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets[inputs.ssh_host_secret] }} >> ~/.ssh/known_hosts

      - name: Copy helper scripts to VPS
        run: |
          scp scripts/blue-green-switch.sh \
              scripts/health-check.sh \
              deploy@${{ secrets[inputs.ssh_host_secret] }}:/tmp/

          ssh deploy@${{ secrets[inputs.ssh_host_secret] }} \
            "chmod +x /tmp/blue-green-switch.sh /tmp/health-check.sh"

      - name: Determine current active slot
        id: current-slot
        run: |
          ACTIVE=$(ssh deploy@${{ secrets[inputs.ssh_host_secret] }} \
            "grep -oP 'server\s+${{ inputs.service_name }}-\K(blue|green)(?=:)' ${{ inputs.nginx_config_path }}")

          if [ "$ACTIVE" != "blue" ] && [ "$ACTIVE" != "green" ]; then
            echo "❌ Could not determine active slot from nginx config (got: '$ACTIVE')"
            exit 1
          fi

          TARGET=$([ "$ACTIVE" = "blue" ] && echo "green" || echo "blue")
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Current active slot: $ACTIVE → deploying to: $TARGET"

      - name: Pull new image on VPS
        run: |
          ssh deploy@${{ secrets[inputs.ssh_host_secret] }} \
            "cd ${{ inputs.deploy_dir }} && \
            IMAGE_TAG=${{ inputs.image_tag }} \
             docker compose -f ${{ inputs.compose_file }} \
               pull ${{ inputs.service_name }}-${{ steps.current-slot.outputs.target }}"

      - name: Start inactive slot with new image
        run: |
          ssh deploy@${{ secrets[inputs.ssh_host_secret] }} \
            "cd ${{ inputs.deploy_dir }} && \
             IMAGE_TAG=${{ inputs.image_tag }} \
             docker compose -f ${{ inputs.compose_file }} \
               up -d --no-deps \
               ${{ inputs.service_name }}-${{ steps.current-slot.outputs.target }}"

      - name: Health check new slot
        id: health
        run: |
          TARGET_PORT=$([ "${{ steps.current-slot.outputs.target }}" = "blue" ] \
            && echo "${{ inputs.blue_port }}" \
            || echo "${{ inputs.green_port }}")

          ssh deploy@${{ secrets[inputs.ssh_host_secret] }} \
            "TARGET_PORT=$TARGET_PORT \
             HEALTH_PATH=${{ inputs.health_path }} \
             HEALTH_HEADER='${{ inputs.health_header }}' \
             /tmp/health-check.sh"

      - name: Switch nginx upstream to new slot
        id: swap
        if: steps.health.outcome == 'success'
        run: |
          ssh deploy@${{ secrets[inputs.ssh_host_secret] }} \
            "NGINX_CONFIG=${{ inputs.nginx_config_path }} \
            SERVICE=${{ inputs.service_name }} \
            TARGET_SLOT=${{ steps.current-slot.outputs.target }} \
            CONTAINER_PORT=${{ inputs.container_port }} \
            NGINX_CONTAINER=nginx \
            /tmp/blue-green-switch.sh"
          echo "deployed_slot=${{ steps.current-slot.outputs.target }}" >> "$GITHUB_OUTPUT"

      - name: Stop old slot
        if: steps.swap.outcome == 'success'
        run: |
          PREV_SLOT=${{ steps.current-slot.outputs.active }}
          ssh deploy@${{ secrets[inputs.ssh_host_secret] }} \
            "cd ${{ inputs.deploy_dir }} && \
            IMAGE_TAG=${{ inputs.image_tag }} docker compose -f ${{ inputs.compose_file }} \
              stop ${{ inputs.service_name }}-${{ steps.current-slot.outputs.active }} && \
            IMAGE_TAG=${{ inputs.image_tag }} docker compose -f ${{ inputs.compose_file }} \
              rm -f ${{ inputs.service_name }}-${{ steps.current-slot.outputs.active }}"
          echo "✅ Stopped old slot: ${PREV_SLOT}"

      - name: Rollback — deploy failed, clean up target slot
        id: rollback
        if: failure() && steps.current-slot.outcome == 'success'
        run: |
          echo "❌ Deploy failed — cleaning up target slot (${{ steps.current-slot.outputs.target }})"
          ssh deploy@${{ secrets[inputs.ssh_host_secret] }} \
            "cd ${{ inputs.deploy_dir }} && \
            docker compose -f ${{ inputs.compose_file }} \
              stop ${{ inputs.service_name }}-${{ steps.current-slot.outputs.target }} || true && \
            docker compose -f ${{ inputs.compose_file }} \
              rm -f ${{ inputs.service_name }}-${{ steps.current-slot.outputs.target }} || true"
          echo "rolled_back=true" >> "$GITHUB_OUTPUT"

  notify-result:
    runs-on: ubuntu-latest
    needs: blue-green-deploy
    if: always()
    steps:
      - name: Notify Telegram — result
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message_thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          format: html
          message: |
            ${{ needs.blue-green-deploy.result == 'success' && '✅ <b>Prod Deploy Succeeded</b>' || '❌ <b>Prod Deploy FAILED — Rolled Back</b>' }}

            <b>Service:</b> ${{ inputs.display_name }}
            <b>Active Slot:</b> ${{ needs.blue-green-deploy.outputs.deployed_slot || 'unchanged (rollback)' }}
            <b>Rolled Back:</b> ${{ needs.blue-green-deploy.outputs.rolled_back || 'false' }}
            <b>Tag:</b> <code>${{ inputs.image_tag }}</code>

            🔗 <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Run</a>