name: Upstream sync + build trigger

on:
  schedule:
    - cron: '5 7 * * 6'   # Saturday 07:05 UTC
  workflow_dispatch:
    inputs:
      service:
        description: 'Which service to sync+build (or "all")'
        required: true
        default: 'all'
        type: choice
        options: [all, bot, cabinet, subscription-page]

permissions:
  contents: read

jobs:
  sync-bot:
    if: inputs.service == 'all' || inputs.service == 'bot' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      synced: ${{ steps.sync.outputs.has_new_commits }}
    steps:
      - name: Checkout target repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: amster2k2x/remnawave-bedolaga-telegram-bot
          token: ${{ secrets.GH_SYNC_TOKEN }}
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Sync bot fork with upstream
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@83d78e8c4bf524e79b091cf257deba4dee9e60df # v3.4.3
        with:
          upstream_sync_repo: BEDOLAGA-DEV/remnawave-bedolaga-telegram-bot
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GH_SYNC_TOKEN }}

  sync-cabinet:
    if: inputs.service == 'all' || inputs.service == 'cabinet' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      synced: ${{ steps.sync.outputs.has_new_commits }}
    steps:
      - name: Checkout target repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: amster2k2x/bedolaga-cabinet
          token: ${{ secrets.GH_SYNC_TOKEN }}
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Sync cabinet fork with upstream
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@83d78e8c4bf524e79b091cf257deba4dee9e60df # v3.4.3
        with:
          upstream_sync_repo: BEDOLAGA-DEV/bedolaga-cabinet
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GH_SYNC_TOKEN }}

  sync-subscription-page:
    if: inputs.service == 'all' || inputs.service == 'subscription-page' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      synced: ${{ steps.sync.outputs.has_new_commits }}
    steps:
      - name: Checkout target repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: amster2k2x/remnawave-subscription-page
          token: ${{ secrets.GH_SYNC_TOKEN }}
          ref: main
          fetch-depth: 0
          persist-credentials: false
          
      - name: Sync subscription-page fork with upstream
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@83d78e8c4bf524e79b091cf257deba4dee9e60df # v3.4.3
        with:
          upstream_sync_repo: remnawave/subscription-page
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GH_SYNC_TOKEN }}

  trigger-bot-build:
    needs: sync-bot
    if: needs.sync-bot.outputs.synced == 'true' || inputs.service == 'bot'
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/build-and-push-bot.yml
    secrets: inherit

  trigger-cabinet-build:
    needs: sync-cabinet
    if: needs.sync-cabinet.outputs.synced == 'true' || inputs.service == 'cabinet'
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/build-and-push-cabinet.yml
    secrets: inherit

  trigger-subscription-page-build:
    needs: sync-subscription-page
    if: needs.sync-subscription-page.outputs.synced == 'true' || inputs.service == 'subscription-page'
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/build-and-push-subscription-page.yml
    secrets: inherit
