name: Upstream sync + build trigger + deploy-test + deploy prod

on:
  schedule:
    - cron: '30 13 * * 6'   # Saturday 07:05 UTC
  workflow_dispatch:
    inputs:
      service:
        description: 'Which service to sync+build+test+deploy prod (or "all")'
        required: true
        default: 'all'
        type: choice
        options: [all, bot, cabinet, subscription-page, remnawave-backend, remnawave-frontend, remnawave-node]

permissions:
  contents: read

jobs:
  sync-bot:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.service == 'all' || github.event.inputs.service == 'bot'))
    runs-on: ubuntu-latest
    outputs:
      synced: ${{ steps.sync.outputs.has_new_commits }}
    steps:
      - name: Checkout target repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: amster2k2x/remnawave-bedolaga-telegram-bot
          token: ${{ secrets.PAT_TOKEN }}
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # use instead of aormsby/Fork-Sync-With-Upstream-action@v3.4.3 because it supports remote repos
      - name: Sync bot fork with upstream
        id: sync
        uses: silvzr/Fork-Sync-With-Upstream-action@64c72154809503219edfa70e03f61dc11bfe68d0 # v3.4.3
        with:
          upstream_sync_repo: BEDOLAGA-DEV/remnawave-bedolaga-telegram-bot
          upstream_sync_branch: main
          upstream_repo_access_token: ${{ secrets.PAT_TOKEN }}
          target_sync_repo: amster2k2x/remnawave-bedolaga-telegram-bot
          target_sync_branch: main
          target_repo_token: ${{ secrets.PAT_TOKEN }}

  sync-cabinet:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.service == 'all' || github.event.inputs.service == 'cabinet'))
    runs-on: ubuntu-latest
    outputs:
      synced: ${{ steps.sync.outputs.has_new_commits }}
    steps:
      - name: Checkout target repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: amster2k2x/bedolaga-cabinet
          token: ${{ secrets.PAT_TOKEN }}
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Sync cabinet fork with upstream
        id: sync
        uses: silvzr/Fork-Sync-With-Upstream-action@64c72154809503219edfa70e03f61dc11bfe68d0 # v3.4.3
        with:
          upstream_sync_repo: BEDOLAGA-DEV/bedolaga-cabinet
          upstream_sync_branch: main
          upstream_repo_access_token: ${{ secrets.PAT_TOKEN }}
          target_sync_repo: amster2k2x/remnawave-bedolaga-cabinet
          target_sync_branch: main
          target_repo_token: ${{ secrets.PAT_TOKEN }}

  sync-subscription-page:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.service == 'all' || github.event.inputs.service == 'subscription-page'))
    runs-on: ubuntu-latest
    outputs:
      synced: ${{ steps.sync.outputs.has_new_commits }}
    steps:
      - name: Checkout target repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: amster2k2x/remnawave-subscription-page
          token: ${{ secrets.PAT_TOKEN }}
          ref: main
          fetch-depth: 0
          persist-credentials: false
          
      - name: Sync subscription-page fork with upstream
        id: sync
        uses: silvzr/Fork-Sync-With-Upstream-action@64c72154809503219edfa70e03f61dc11bfe68d0 # v3.4.3
        with:
          upstream_sync_repo: remnawave/subscription-page
          upstream_sync_branch: main
          upstream_repo_access_token: ${{ secrets.PAT_TOKEN }}
          target_sync_repo: amster2k2x/remnawave-subscription-page
          target_sync_branch: main
          target_repo_token: ${{ secrets.PAT_TOKEN }}

  sync-remnawave-backend:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.service == 'all' || github.event.inputs.service == 'remnawave-backend'))
    runs-on: ubuntu-latest
    outputs:
      synced: ${{ steps.sync.outputs.has_new_commits }}
    steps:
      - name: Checkout target repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: amster2k2x/remnawave-backend
          token: ${{ secrets.PAT_TOKEN }}
          ref: main
          fetch-depth: 0
          persist-credentials: false
          
      - name: Sync remnawave-backend fork with upstream
        id: sync
        uses: silvzr/Fork-Sync-With-Upstream-action@64c72154809503219edfa70e03f61dc11bfe68d0 # v3.4.3
        with:
          upstream_sync_repo: remnawave/backend
          upstream_sync_branch: main
          upstream_repo_access_token: ${{ secrets.PAT_TOKEN }}
          target_sync_repo: amster2k2x/remnawave-backend
          target_sync_branch: main
          target_repo_token: ${{ secrets.PAT_TOKEN }}

  sync-remnawave-frontend:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.service == 'all' || github.event.inputs.service == 'remnawave-frontend'))
    runs-on: ubuntu-latest
    outputs:
      synced: ${{ steps.sync.outputs.has_new_commits }}
    steps:
      - name: Checkout target repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: amster2k2x/remnawave-frontend
          token: ${{ secrets.PAT_TOKEN }}
          ref: main
          fetch-depth: 0
          persist-credentials: false
          
      - name: Sync remnawave-frontend fork with upstream
        id: sync
        uses: silvzr/Fork-Sync-With-Upstream-action@64c72154809503219edfa70e03f61dc11bfe68d0 # v3.4.3
        with:
          upstream_sync_repo: remnawave/frontend
          upstream_sync_branch: main
          upstream_repo_access_token: ${{ secrets.PAT_TOKEN }}
          target_sync_repo: amster2k2x/remnawave-frontend
          target_sync_branch: main
          target_repo_token: ${{ secrets.PAT_TOKEN }}

  sync-remnawave-node:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.service == 'all' || github.event.inputs.service == 'remnawave-node'))
    runs-on: ubuntu-latest
    outputs:
      synced: ${{ steps.sync.outputs.has_new_commits }}
    steps:
      - name: Checkout target repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: amster2k2x/remnawave-node
          token: ${{ secrets.PAT_TOKEN }}
          ref: main
          fetch-depth: 0
          persist-credentials: false
          
      - name: Sync remnawave-node fork with upstream
        id: sync
        uses: silvzr/Fork-Sync-With-Upstream-action@64c72154809503219edfa70e03f61dc11bfe68d0 # v3.4.3
        with:
          upstream_sync_repo: remnawave/node
          upstream_sync_branch: main
          upstream_repo_access_token: ${{ secrets.PAT_TOKEN }}
          target_sync_repo: amster2k2x/remnawave-node
          target_sync_branch: main
          target_repo_token: ${{ secrets.PAT_TOKEN }}

  trigger-bot-build:
    needs: sync-bot
    if: |
      needs.sync-bot.outputs.synced == 'true' || 
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.service == 'all' || github.event.inputs.service == 'bot'))
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/build-and-push-bot.yml
    secrets: inherit

  trigger-cabinet-build:
    needs: sync-cabinet
    if: |
      needs.sync-cabinet.outputs.synced == 'true' || 
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.service == 'all' || github.event.inputs.service == 'cabinet'))
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/build-and-push-cabinet.yml
    secrets: inherit

  trigger-subscription-page-build:
    needs: sync-subscription-page
    if: |
      needs.sync-subscription-page.outputs.synced == 'true' || 
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.service == 'all' || github.event.inputs.service == 'subscription-page'))
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/build-and-push-rw-subscription-page.yml
    secrets: inherit

  trigger-remnawave-backend-build:
    needs: sync-remnawave-backend
    if: |
      needs.sync-remnawave-backend.outputs.synced == 'true' || 
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.service == 'all' || github.event.inputs.service == 'remnawave-backend'))
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/build-and-push-rw-backend.yml
    secrets: inherit

  trigger-remnawave-frontend-build:
    needs: sync-remnawave-frontend
    if: |
      needs.sync-remnawave-frontend.outputs.synced == 'true' || 
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.service == 'all' || github.event.inputs.service == 'remnawave-frontend'))
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/build-and-push-rw-frontend.yml
    secrets: inherit

  trigger-remnawave-node-build:
    needs: sync-remnawave-node
    if: |
      needs.sync-remnawave-node.outputs.synced == 'true' || 
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.service == 'all' || github.event.inputs.service == 'remnawave-node'))
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/build-and-push-rw-node.yml
    secrets: inherit

  # ── Runs after all builds complete. Skips if all builds were skipped.
  # Fails if any triggered build failed (don't deploy broken images).
  deploy-test:
    needs:
      - trigger-bot-build
      - trigger-cabinet-build
      - trigger-subscription-page-build
      - trigger-remnawave-backend-build
      - trigger-remnawave-node-build
      # trigger-remnawave-frontend-build excluded — frontend is a build
      # artifact bundled inside the backend image, not a standalone service.
    if: |
      always() &&
      (
        needs.trigger-bot-build.result == 'success' ||
        needs.trigger-cabinet-build.result == 'success' ||
        needs.trigger-subscription-page-build.result == 'success' ||
        needs.trigger-remnawave-backend-build.result == 'success' ||
        needs.trigger-remnawave-node-build.result == 'success'
      ) &&
      needs.trigger-bot-build.result != 'failure' &&
      needs.trigger-cabinet-build.result != 'failure' &&
      needs.trigger-subscription-page-build.result != 'failure' &&
      needs.trigger-remnawave-backend-build.result != 'failure' &&
      needs.trigger-remnawave-node-build.result != 'failure'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-test.yml
    with:
      auto_destroy: false   # automated runs not destroy — manual review gate
    secrets: inherit

  deploy-prod-panel:
    needs:
      - deploy-test
      - trigger-remnawave-backend-build
    if: |
      always() &&
      needs.deploy-test.result == 'success' &&
      needs.trigger-remnawave-backend-build.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-prod-panel.yml
    with:
      image_tag: ${{ needs.trigger-remnawave-backend-build.outputs.version }}
    secrets: inherit

  deploy-prod-bot:
    needs:
      - deploy-test
      - trigger-bot-build
      - trigger-cabinet-build
    if: |
      always() &&
      needs.deploy-test.result == 'success' &&
      (
        needs.trigger-bot-build.result == 'success' ||
        needs.trigger-cabinet-build.result == 'success'
      ) &&
      needs.trigger-bot-build.result != 'failure' &&
      needs.trigger-cabinet-build.result != 'failure'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-prod-bot.yml
    with:
      image_tag: ${{ needs.trigger-bot-build.outputs.version || 'latest' }}
      cabinet_tag: ${{ needs.trigger-cabinet-build.outputs.version || 'latest' }}
    secrets: inherit

  deploy-prod-sub:
    needs:
      - deploy-test
      - trigger-subscription-page-build
    if: |
      always() &&
      needs.deploy-test.result == 'success' &&
      needs.trigger-subscription-page-build.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-prod-sub.yml
    with:
      image_tag: ${{ needs.trigger-subscription-page-build.outputs.version }}
    secrets: inherit

  deploy-prod-nodes:
    needs:
      - deploy-test
      - trigger-remnawave-node-build
    if: |
      always() &&
      needs.deploy-test.result == 'success' &&
      needs.trigger-remnawave-node-build.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-prod-nodes.yml
    with:
      image_tag: ${{ needs.trigger-remnawave-node-build.outputs.version }}
    secrets: inherit