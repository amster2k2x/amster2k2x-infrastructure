name: Build Remnawave Node (reusable)

on:
  workflow_call:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build:
    uses: ./.github/workflows/build-and-push-template.yml
    with:
      repo: amster2k2x/remnawave-node
      display_name: Remnawave Node
      image: ghcr.io/amster2k2x/remnawave-node
      dockerhub_image: sammosdev/remnawave-node
      dockerfile: docker/Dockerfile
    secrets: inherit