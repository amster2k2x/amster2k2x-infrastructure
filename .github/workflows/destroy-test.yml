name: Test environment - manual teardown

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  TF_VAR_environment: test

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: test
    defaults:
      run:
        working-directory: terraform/build
    steps:
      - uses: actions/checkout@v7

      - name: Assume cicd-runner hub role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_HUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-hub

      - name: Assume test-account deploy role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-test-deploy
          role-chaining: true

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=build/test/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"
        env:
          TF_VAR_workload_account_state_bucket: ${{ secrets.TF_STATE_BUCKET }}

      - name: Terraform destroy
        run: terraform destroy -auto-approve
        env:
          TF_VAR_workload_account_state_bucket: ${{ secrets.TF_STATE_BUCKET }}
          # Image vars unused by destroy but required by variables.tf defaults - fine to omit
