name: Test environment - manual teardown

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  TF_VAR_environment: test

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: test
    defaults:
      run:
        working-directory: terraform/build
    steps:
      - uses: actions/checkout@v7

      - name: Assume cicd-runner hub role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_HUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-hub

      - name: Assume test-account deploy role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-test-deploy
          role-chaining: true
          role-skip-session-tagging: true

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=build/test/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true"
        env:
          TF_VAR_workload_account_state_bucket: ${{ secrets.TF_BOOTSTRAP_STATE_BUCKET }}

      - name: Run db-tools backup
        run: |
          TASK_DEF=$(terraform output -raw db_tools_task_definition_arn)
          SUBNETS=$(terraform output -json private_app_subnet_ids | jq -r 'join(",")')
          SG=$(terraform output -raw ecs_tasks_sg_id)

          TASK_ARN=$(aws ecs run-task \
            --cluster amster2k2x-test \
            --task-definition "$TASK_DEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"db-tools","command":["/scripts/backup.sh"]}]}' \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Backup task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster amster2k2x-test --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster amster2k2x-test \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::db-tools backup failed with exit code $EXIT_CODE"
            exit 1
          fi
          echo "Backup complete — safe to destroy."

      - name: Terraform destroy
        run: terraform destroy -auto-approve
        env:
          TF_VAR_workload_account_state_bucket: ${{ secrets.TF_BOOTSTRAP_STATE_BUCKET }}
