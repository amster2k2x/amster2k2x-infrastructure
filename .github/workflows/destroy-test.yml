name: Test environment - manual teardown

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Destroy even if the backup fails"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  TF_VAR_environment: test

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: test
    defaults:
      run:
        working-directory: terraform/build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assume cicd-runner hub role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_HUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-hub

      - name: Assume test-account deploy role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-test-deploy
          role-chaining: true
          role-skip-session-tagging: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=build/test/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true"
        env:
          TF_VAR_workload_account_state_bucket: ${{ secrets.TF_BOOTSTRAP_STATE_BUCKET }}

      - name: Run db-tools backup
        run: |
          # Partial/failed applies leave these outputs missing -> nothing to back up.
          if ! TASK_DEF=$(terraform output -raw db_tools_task_definition_arn 2>/dev/null) \
            || ! SUBNETS=$(terraform output -json private_app_subnet_ids 2>/dev/null | jq -r 'join(",")') \
            || ! SG=$(terraform output -raw ecs_tasks_sg_id 2>/dev/null); then
            echo "::warning::db-tools outputs not in state (partial or failed apply) - skipping backup"
            exit 0
          fi

          TASK_ARN=$(aws ecs run-task \
            --cluster amster2k2x-test \
            --task-definition "$TASK_DEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"db-tools","command":["/scripts/backup.sh"]}]}' \
            --query 'tasks[0].taskArn' \
            --output text)

          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "::error::run-task did not start a backup task"
            [ "${{ inputs.force }}" = "true" ] && exit 0 || exit 1
          fi

          echo "Backup task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster amster2k2x-test --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster amster2k2x-test \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::db-tools backup failed (exit code: $EXIT_CODE)"
            [ "${{ inputs.force }}" = "true" ] && exit 0 || exit 1
          fi
          echo "Backup complete - safe to destroy."

      - name: Terraform destroy
        run: terraform destroy -auto-approve
        env:
          TF_VAR_workload_account_state_bucket: ${{ secrets.TF_BOOTSTRAP_STATE_BUCKET }}
