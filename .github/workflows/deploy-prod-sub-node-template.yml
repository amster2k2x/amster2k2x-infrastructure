name: "[reusable] Prod simple deploy (pull/down/up)"

on:
  workflow_call:
    inputs:
      ssh_host_secret:
        required: true
        type: string
      service_name:
        description: 'docker compose service name to restart'
        required: true
        type: string
      display_name:
        required: true
        type: string
      compose_file:
        required: true
        type: string
      deploy_dir:
        required: true
        type: string
      image_tag:
        required: false
        type: string
        default: 'latest'

jobs:
  simple-deploy:
    runs-on: ubuntu-latest
    environment: prod        # ← triggers approval gate + scopes secrets
    steps:
      - name: Notify Telegram — start
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message_thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          format: html
          message: |
            🔄 <b>Prod Deploy Started</b>

            <b>Service:</b> ${{ inputs.display_name }}
            <b>Strategy:</b> Simple (pull → down → up)
            <b>Trigger:</b> ${{ github.event_name }} by ${{ github.actor }}

      - name: Install SSH key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: ssh-keyscan -T 10 -H ${{ secrets[inputs.ssh_host_secret] }} >> ~/.ssh/known_hosts

      - name: Pull, restart service
        run: |
          ssh deploy@${{ secrets[inputs.ssh_host_secret] }} \
            "cd ${{ inputs.deploy_dir }} && \
            export IMAGE_TAG=${{ inputs.image_tag }} && \
            docker compose -f ${{ inputs.compose_file }} pull ${{ inputs.service_name }} && \
            docker compose -f ${{ inputs.compose_file }} \
                up -d --no-deps --force-recreate ${{ inputs.service_name }}"       

      - name: Notify Telegram — result
        if: always()
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message_thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          format: html
          message: |
            ${{ job.status == 'success' && '✅ <b>Deploy Succeeded</b>' || '❌ <b>Deploy FAILED</b>' }}
            <b>Service:</b> ${{ inputs.display_name }}