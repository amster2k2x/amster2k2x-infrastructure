name: Test environment - deploy, test, teardown

on:
  workflow_dispatch:
    inputs:
      panel_backend_image:
        required: true
        type: string
      bot_worker_image:
        required: true
        type: string
      cabinet_image:
        required: true
        type: string
      subscription_page_image:
        required: true
        type: string
      node_image:
        required: true
        type: string
      db_tools_image:        # has a default in variables.tf but explicit is better
        required: false
        type: string
        default: ghcr.io/amster2k2x/db-tools:latest
      auto_destroy:
        description: 'Destroy after smoke tests. Set false to leave it running for manual poking — tear down with destroy-test.yml when done.'
        required: false
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  TF_VAR_environment: test
  TF_VAR_panel_backend_image: ${{ inputs.panel_backend_image }}
  TF_VAR_bot_image: ${{ inputs.bot_worker_image }}
  TF_VAR_cabinet_image: ${{ inputs.cabinet_image }}
  TF_VAR_subscription_page_image: ${{ inputs.subscription_page_image }}
  TF_VAR_node_image: ${{ inputs.node_image }}
  TF_VAR_db_tools_image: ${{ inputs.db_tools_image }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test   # <- GitHub Environment "test", set up manually per BOOTSTRAP.md
    defaults:
      run:
        working-directory: terraform/build
    steps:
      - uses: actions/checkout@v7

      - name: Debug OIDC token claims
        working-directory: .
        run: |
          TOKEN=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq '{sub, aud}'

      # Hop 1: GitHub OIDC -> hub role, in cicd-runner-account.
      # This role can do nothing except assume the next role.
      - name: Assume cicd-runner hub role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_HUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-hub

      # Hop 2: hub role -> cross-account deploy role, in test-account.
      # Calling configure-aws-credentials again chains onto the hop-1
      # credentials automatically — no static keys anywhere in this flow.
      - name: Assume test-account deploy role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-test-deploy
          role-chaining: true
          role-skip-session-tagging: true

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=build/test/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true"
        env:
          TF_VAR_workload_account_state_bucket: ${{ secrets.TF_BOOTSTRAP_STATE_BUCKET }}

      - name: Terraform apply
        run: terraform apply -auto-approve
        env:
          TF_VAR_workload_account_state_bucket: ${{ secrets.TF_BOOTSTRAP_STATE_BUCKET }}

      - name: Run db-tools restore
        run: |
          TASK_DEF=$(terraform output -raw db_tools_task_definition_arn)
          SUBNETS=$(terraform output -json private_app_subnet_ids | jq -r 'join(",")')
          SG=$(terraform output -raw ecs_tasks_sg_id)

          TASK_ARN=$(aws ecs run-task \
            --cluster amster2k2x-test \
            --task-definition "$TASK_DEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"db-tools","command":["/scripts/restore.sh"]}]}' \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Restore task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster amster2k2x-test --tasks "$TASK_ARN"

          DETAILS=$(aws ecs describe-tasks \
            --cluster amster2k2x-test \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].{stopCode:stopCode,stoppedReason:stoppedReason,containers:containers[*].{name:name,exitCode:exitCode,reason:reason}}' \
            --output json)
          echo "$DETAILS"

          EXIT_CODE=$(echo "$DETAILS" | jq -r '.containers[0].exitCode')

          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::db-tools restore failed with exit code $EXIT_CODE"
            exit 0
          fi
          echo "Restore complete."

      - name: Update Dynu DNS — point ALB subdomains at the new ALB
        run: |
          ALB_DNS=$(terraform output -raw alb_dns_name)
          echo "ALB DNS: $ALB_DNS"

          DOMAIN_ID=$(curl -sf "https://api.dynu.com/v2/dns" \
            -H "API-Key: ${{ secrets.DYNU_API_KEY }}" \
            -H "Accept: application/json" \
            | jq -r '([.domains[]? | select(.name == "amster2k2x.mywire.org")][0].id) // empty')

          if [ -z "$DOMAIN_ID" ]; then
            echo "::error::Could not find amster2k2x.mywire.org in Dynu."
            exit 1
          fi

          for SUBDOMAIN in panel.test sub.test bot.test; do
            echo "Upserting CNAME: ${SUBDOMAIN}.amster2k2x.mywire.org → $ALB_DNS"

            RECORD_ID=$(curl -sf "https://api.dynu.com/v2/dns/${DOMAIN_ID}/record" \
              -H "API-Key: ${{ secrets.DYNU_API_KEY }}" \
              -H "Accept: application/json" \
              | jq -r --arg sub "$SUBDOMAIN" \
                '([.dnsRecords[]? | select(.nodeName == $sub)][0].id) // empty')

            if [ -n "$RECORD_ID" ]; then
              curl -sf -X DELETE "https://api.dynu.com/v2/dns/${DOMAIN_ID}/record/${RECORD_ID}" \
                -H "API-Key: ${{ secrets.DYNU_API_KEY }}" > /dev/null
            fi

            curl -sf -X POST "https://api.dynu.com/v2/dns/${DOMAIN_ID}/record" \
              -H "API-Key: ${{ secrets.DYNU_API_KEY }}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -d "{
                \"nodeName\": \"${SUBDOMAIN}\",
                \"recordType\": \"CNAME\",
                \"ttl\": 120,
                \"state\": true,
                \"hostName\": \"${SUBDOMAIN}.amster2k2x.mywire.org\",
                \"host\": \"${ALB_DNS}\"
              }"
          done

          echo "Waiting 60s for DNS propagation..."
          sleep 60

      - name: Wait for ECS services to be stable
        run: |
          for svc in panel bot cabinet subscription node; do
            echo "Waiting for $svc..."
            aws ecs wait services-stable \
              --cluster amster2k2x-test \
              --services "$svc" \
              --region "${{ env.AWS_REGION }}"
          done

      - name: Smoke tests
        run: |
          curl -sf "https://panel.test.amster2k2x.mywire.org/" -o /dev/null \
            && echo "Panel OK"
          curl -sf "https://sub.test.amster2k2x.mywire.org/"   -o /dev/null \
            && echo "Sub page OK"
          curl -sf "https://bot.test.amster2k2x.mywire.org/"   -o /dev/null \
            && echo "Bot OK"

      - name: Print environment URLs
        if: ${{ inputs.auto_destroy == false }}
        run: |
          echo "### Test environment is running" >> $GITHUB_STEP_SUMMARY
          echo "| Service | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Panel   | https://panel.test.amster2k2x.mywire.org |" >> $GITHUB_STEP_SUMMARY
          echo "| Sub page| https://sub.test.amster2k2x.mywire.org   |" >> $GITHUB_STEP_SUMMARY
          echo "| Cabinet | https://bot.test.amster2k2x.mywire.org   |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run **destroy-test.yml** when done." >> $GITHUB_STEP_SUMMARY

      - name: Terraform destroy
        if: always() && inputs.auto_destroy
        run: terraform destroy -auto-approve
        env:
          TF_VAR_workload_account_state_bucket: ${{ secrets.TF_BOOTSTRAP_STATE_BUCKET }}
