name: Build cabinet (reusable)

on:
  workflow_call:
    outputs:
      version:
        description: 'Semver of the built image'
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build:
    uses: ./.github/workflows/build-and-push-template.yml
    with:
      repo: amster2k2x/remnawave-bedolaga-cabinet
      display_name: cabinet
      image: ghcr.io/amster2k2x/remnawave-bedolaga-cabinet
      dockerhub_image: sammosdev/remnawave-bedolaga-cabinet
      build_args: |
        VITE_API_URL=${{ vars.VITE_API_URL }}
        VITE_APP_LOGO=${{ vars.VITE_APP_LOGO }}
        VITE_APP_NAME=${{ vars.VITE_APP_NAME }}
        VITE_TELEGRAM_BOT_USERNAME=${{ vars.VITE_TELEGRAM_BOT_USERNAME }}
    secrets: inherit