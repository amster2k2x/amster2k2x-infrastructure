name: Build cabinet (reusable)

on:
  workflow_call:
    inputs:
      app-token:
        required: true
        type: string

env:
  IMAGE: ghcr.io/amster2k2x/remnawave-bedolaga-cabinet
  DOCKERHUB_IMAGE: sammosdev/remnawave-bedolaga-cabinet

permissions:
  contents: read

jobs:
  notify-tg-start:
    name: Notify Telegram about build start
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          repository: amster2k2x/remnawave-bedolaga-cabinet
          token: ${{ inputs.app-token }}
      
      - name: Send Telegram message with info status
        uses: proDreams/actions-telegram-notifier@main
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          status: info
          notify_fields: 'repository,branch,commit,workflow'
          title: 'Build started — bot-cabinet'

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          repository: amster2k2x/remnawave-bedolaga-cabinet
          token: ${{ inputs.app-token }}
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ inputs.app-token }}

  build-images:
    name: Build ${{ matrix.platform }}
    needs: secret-scan
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          repository: amster2k2x/remnawave-bedolaga-cabinet
          token: ${{ inputs.app-token }}

      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ inputs.app-token }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          # Pass build args if cabinet needs them at build time
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_APP_LOGO=${{ vars.VITE_APP_LOGO }}
            VITE_APP_NAME=${{ vars.VITE_APP_NAME }}
            VITE_TELEGRAM_BOT_USERNAME=${{ vars.VITE_TELEGRAM_BOT_USERNAME }}
          outputs: |
            type=image,"name=${{ env.IMAGE }},${{ env.DOCKERHUB_IMAGE }}",push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-manifests:
    name: Merge & push manifests
    needs: build-images
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ inputs.app-token }}

      - name: Create & push manifest lists
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.DOCKERHUB_IMAGE }}:latest \
            -t ${{ env.DOCKERHUB_IMAGE }}:${{ github.ref_name }} \
            $(printf '${{ env.DOCKERHUB_IMAGE }}@sha256:%s ' *)
          
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:latest \
            -t ${{ env.IMAGE }}:${{ github.ref_name }} \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ github.ref_name }}

  scan-images:
    name: Scan images
    needs: merge-manifests
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ inputs.app-token }}

      - name: Trivy — fail on CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ github.ref_name }}
          format: table
          exit-code: '1'
          severity: CRITICAL

      - name: Trivy — warn on HIGH
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ github.ref_name }}
          format: table
          exit-code: '0'
          severity: HIGH

  notify-tg-result:
    name: Notify Telegram about build result
    runs-on: ubuntu-latest
    needs: [merge-manifests, scan-images]
    if: always()
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          repository: amster2k2x/remnawave-bedolaga-telegram-bot
          token: ${{ inputs.app-token }}

      - name: Send Telegram message with result status
        uses: proDreams/actions-telegram-notifier@main
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          status: ${{ (needs.merge-manifests.result == 'success' && needs.scan-images.result == 'success') && 'success' || 'error' }}
          notify_fields: 'repository,branch,commit,workflow'
          title: ${{ (needs.merge-manifests.result == 'success' && needs.scan-images.result == 'success') && 'Build finished — bot' || 'Build failed — bot' }}