name: Build Remnawave Frontend (reusable)

on:
  workflow_call:

env:
  IMAGE: ghcr.io/amster2k2x/remnawave-frontend
  DOCKERHUB_IMAGE: sammosdev/remnawave-frontend

jobs:
  notify-tg-start:
    name: Notify Telegram about build start
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          repository: amster2k2x/remnawave-frontend
          token: ${{ secrets.PAT_TOKEN }}
          ref: main
          fetch-depth: 0
          persist-credentials: false
      
      - name: Send Telegram message with info status
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message_thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }} # Supports forum topics natively!
          format: markdown
          message: |
            🚀 *Build Started* 🚀
            
            *Service:* ${{ github.event.inputs.service || 'All Services (Scheduled Sync)' }}
            *Trigger:* ${{ github.event_name == 'schedule' && 'Weekly Cron Schedule' || 'Manual Trigger' }}
            *Repository:* ${{ github.repository }}

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          repository: amster2k2x/remnawave-frontend
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0          # Gitleaks needs full history
          persist-credentials: false

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          repository: amster2k2x/remnawave-frontend
          token: ${{ secrets.PAT_TOKEN }}
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Extract package version
        id: get-version
        run: |
          VERSION=$(jq -r '.version' ./package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: ./package-lock.json

      - name: Build frontend
        run: |
          npm ci
          npm run start:build

      - name: Create ZIP archive of /dist
        run: |
          zip -r remnawave-frontend.zip ./dist

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        with:
          files: remnawave-frontend.zip
          tag_name: ${{ steps.get-version.outputs.version }}
          repository: amster2k2x/remnawave-frontend
          token: ${{ secrets.PAT_TOKEN }}
          generate_release_notes: true
          append_body: true
          make_latest: true
          draft: false
          prerelease: false
          name: ${{ steps.get-version.outputs.version }}
          body: |
            # 🌊 Remnawave Frontend v${{ steps.get-version.outputs.version }}

  notify-tg-result:
    name: Notify Telegram about build result
    runs-on: ubuntu-latest
    needs: build-frontend
    if: always()
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          repository: amster2k2x/remnawave-frontend
          token: ${{ secrets.PAT_TOKEN }}
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Send Telegram message
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message_thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          format: markdown
          message: |
            ${{ (needs.merge-manifests.result == 'success' && needs.scan-images.result == 'success') && '✅ *Build Finished Successfully*' || '❌ *Build Failed*' }}
            
            *Service:* ${{ github.event.inputs.service || 'All Services (Scheduled Sync)' }}
            *Trigger:* ${{ github.event_name == 'schedule' && 'Weekly Cron Schedule' || 'Manual Trigger' }}
            *Repository:* ${{ github.repository }}
            
            *Pipeline Details:*
            • Manifest Merge: `${{ needs.merge-manifests.result }}`
            • Security Scan: `${{ needs.scan-images.result }}`
