name: Deploy Subscription Page to Prod

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Subscription page image tag'
        required: false
        default: 'latest'
  workflow_call:
    inputs:
      image_tag:
        required: false
        type: string
        default: 'latest'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    environment: prod
    steps:
      - name: Notify Telegram — start
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message_thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          format: html
          message: |
            🔄 <b>Prod Deploy Started</b>

            <b>Service:</b> Subscription Page
            <b>Strategy:</b> Simple (pull → down → up)
            <b>Trigger:</b> ${{ github.event_name }} by ${{ github.actor }}

      - name: Install SSH key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: ssh-keyscan -T 10 -H ${{ secrets.PROD_BOT_VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Pull, restart service
        run: |
          ssh deploy@${{ secrets.PROD_BOT_VPS_HOST }} \
            "cd /opt/subscription && \
            export IMAGE_TAG=${{ inputs.image_tag || 'latest' }} && \
            docker compose -f docker-compose.yml pull remnawave-subscription-page && \
            docker compose -f docker-compose.yml \
                up -d --no-deps --force-recreate remnawave-subscription-page"

      - name: Notify Telegram — result
        if: always()
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message_thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          format: html
          message: |
            ${{ job.status == 'success' && '✅ <b>Deploy Succeeded</b>' || '❌ <b>Deploy FAILED</b>' }}
            <b>Service:</b> Subscription Page