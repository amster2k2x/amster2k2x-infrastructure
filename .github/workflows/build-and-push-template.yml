name: Docker build & push (template)

on:
  workflow_call:
    inputs:
      repo:
        description: 'org/repo to build, e.g. amster2k2x/remnawave-node'
        required: true
        type: string
      display_name:
        description: 'Used in Telegram notification titles, e.g. "Remnawave Node"'
        required: true
        type: string
      image:
        required: true
        type: string
      dockerhub_image:
        required: true
        type: string
      version_file:
        required: false
        type: string
        default: package.json
      version_source:
        description: '"jq" for package.json (default) or "toml" for pyproject.toml'
        required: false
        type: string
        default: jq
      version_jq_path:
        required: false
        type: string
        default: .version
      dockerfile:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: Dockerfile
      build_args:
        description: 'Extra docker build-args, one KEY=VALUE per line'
        required: false
        type: string
        default: ''
      gitleaks_allowlist:
        description: 'Extra [allowlist] block content for .gitleaks.toml. Empty = use action defaults only.'
        required: false
        type: string
        default: ''
      matrix_json:
        description: 'JSON array of {platform, runner} build targets'
        required: false
        type: string
        default: '[{"platform":"linux/amd64","runner":"ubuntu-latest"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]'
      needs_frontend_artifact:
        required: false
        type: boolean
        default: false
      frontend_artifact_name:
        required: false
        type: string
        default: frontend-dist
      frontend_artifact_path:
        required: false
        type: string
        default: frontend/dist
      build_metadata_args:
        description: 'If true, auto-appends __RW_METADATA_* build-args (branch, build_time, build_number, version, backend_commit, frontend_commit). Used by remnawave-backend.'
        required: false
        type: boolean
        default: false
      metadata_git_branch:
        description: 'Value for __RW_METADATA_GIT_BRANCH when build_metadata_args is true'
        required: false
        type: string
        default: main
      frontend_url:
        description: 'Optional ARG FRONTEND_URL passed to the Docker build, e.g. a pinned frontend release zip URL'
        required: false
        type: string
        default: ''
      frontend_repo:
        description: 'org/repo used to resolve __RW_METADATA_GIT_FRONTEND_COMMIT (should match whatever frontend_ref/frontend_url point at). Leave empty to skip resolution.'
        required: false
        type: string
        default: ''
      frontend_ref:
        description: 'Branch, tag, or SHA in frontend_repo to resolve the commit SHA for __RW_METADATA_GIT_FRONTEND_COMMIT'
        required: false
        type: string
        default: main
    outputs:
      version:
        description: 'Semver extracted from version file'
        value: ${{ jobs.merge-manifests.outputs.version }}

permissions:
  contents: read

jobs:
  notify-tg-start:
    name: Notify Telegram about build start
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repo }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Send Telegram message with info status
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message_thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }} # Supports forum topics natively!
          format: html
          message: |
            🚀 <b>Build Started</b> 🚀

            <b>Service:</b> ${{ inputs.display_name }}
            <b>Trigger:</b> ${{ github.event_name }} by ${{ github.actor }}
            <b>Repository:</b> ${{ inputs.repo }}

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repo }}
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 1          # Optimized: Only scan the latest commit to save time
          persist-credentials: false

      - name: Create Gitleaks Config Allowlist
        if: inputs.gitleaks_allowlist != ''
        run: |
          cat << 'EOF' > .gitleaks.toml
          [extend]
          useDefault = true

          [allowlist]
          ${{ inputs.gitleaks_allowlist }}
          EOF

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  prepare:
    name: Resolve build metadata
    needs: secret-scan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      build_time: ${{ steps.build-time.outputs.build_time }}
      frontend_commit: ${{ steps.frontend-commit.outputs.sha }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repo }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: main
          fetch-depth: 0
          persist-credentials: false
 
      - name: Extract package version
        id: get-version
        run: |
          if [ "${{ inputs.version_source }}" = "toml" ]; then
            VERSION=$(grep "^version" ${{ inputs.version_file }} | awk -F'"' '{print $2}')
          else
            VERSION=$(jq -r '${{ inputs.version_jq_path }}' ${{ inputs.version_file }})
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
 
      - name: Record build time
        id: build-time
        run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
 
      - name: Resolve frontend commit
        id: frontend-commit
        if: inputs.frontend_repo != ''
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          SHA=$(gh api "repos/${{ inputs.frontend_repo }}/commits/${{ inputs.frontend_ref }}" --jq .sha)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
  
  build-images:
    name: Build ${{ matrix.platform }}
    needs: [secret-scan, prepare]
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix_json) }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          # NEW — unique per service so parallel runs don't collide
          slug=$(echo "${{ inputs.repo }}" | tr '/' '-')
          echo "REPO_SLUG=$slug" >> "$GITHUB_ENV"

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repo }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Download frontend build artifact
        if: inputs.needs_frontend_artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.frontend_artifact_name }}
          path: ${{ inputs.frontend_artifact_path }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PAT_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            ${{ inputs.build_args }}
            ${{ inputs.build_metadata_args && format('__RW_METADATA_GIT_BRANCH={0}', inputs.metadata_git_branch) || '' }}
            ${{ inputs.build_metadata_args && format('__RW_METADATA_BUILD_TIME={0}', needs.prepare.outputs.build_time) || '' }}
            ${{ inputs.build_metadata_args && format('__RW_METADATA_BUILD_NUMBER={0}', github.run_number) || '' }}
            ${{ inputs.build_metadata_args && format('__RW_METADATA_VERSION={0}', needs.prepare.outputs.version) || '' }}
            ${{ inputs.build_metadata_args && format('__RW_METADATA_GIT_BACKEND_COMMIT={0}', github.sha) || '' }}
            ${{ inputs.build_metadata_args && format('__RW_METADATA_GIT_FRONTEND_COMMIT={0}', needs.prepare.outputs.frontend_commit) || '' }}
            ${{ inputs.frontend_url != '' && format('FRONTEND_URL={0}', inputs.frontend_url) || '' }}
          outputs: |
            type=image,"name=${{ inputs.image }},${{ inputs.dockerhub_image }}",push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          # Safely extract all SHA256 hashes using grep
          echo "${{ steps.build.outputs.digest }}" | grep -oE '[a-f0-9]{64}' | while read -r sha; do
            touch "${{ runner.temp }}/digests/$sha"
          done

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ env.REPO_SLUG }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-manifests:
    name: Merge & push manifests
    needs: build-images
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repo }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Extract package version
        id: get-version
        run: |
          if [ "${{ inputs.version_source }}" = "toml" ]; then
            VERSION=$(grep "^version" ${{ inputs.version_file }} | awk -F'"' '{print $2}')
          else
            VERSION=$(jq -r '${{ inputs.version_jq_path }}' ${{ inputs.version_file }})
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set repo slug
        run: echo "REPO_SLUG=$(echo '${{ inputs.repo }}' | tr '/' '-')" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ env.REPO_SLUG }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PAT_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ inputs.image }}
            ${{ inputs.dockerhub_image }}
          tags: |
            type=raw,value=${{ steps.get-version.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=${{ inputs.display_name }}
            org.opencontainers.image.source=https://github.com/${{ inputs.repo }}
            org.opencontainers.image.url=https://github.com/${{ inputs.repo }}

      - name: Create and push manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          # 1. Cleanly parse the target tags into single-line space-separated arguments
          GHCR_TAGS=$(echo '${{ steps.meta.outputs.json }}' | jq -r '.tags[] | select(contains("ghcr.io")) | "-t " + .')
          DH_TAGS=$(echo '${{ steps.meta.outputs.json }}' | jq -r '.tags[] | select(contains("ghcr.io") | not) | "-t " + .')
          
          # 2. Build and push the GHCR manifest by validating the SHAs against GHCR first
          GHCR_DIGEST_ARGS=""
          for sha in *; do
            if docker manifest inspect ${{ inputs.image }}@sha256:$sha >/dev/null 2>&1; then
              GHCR_DIGEST_ARGS="$GHCR_DIGEST_ARGS ${{ inputs.image }}@sha256:$sha"
            fi
          done
          
          docker buildx imagetools create $GHCR_TAGS $GHCR_DIGEST_ARGS
          
          # 3. Build and push the Docker Hub manifest by validating the SHAs against Docker Hub first
          DH_DIGEST_ARGS=""
          for sha in *; do
            if docker manifest inspect ${{ inputs.dockerhub_image }}@sha256:$sha >/dev/null 2>&1; then
              DH_DIGEST_ARGS="$DH_DIGEST_ARGS ${{ inputs.dockerhub_image }}@sha256:$sha"
            fi
          done
          
          docker buildx imagetools create $DH_TAGS $DH_DIGEST_ARGS

      - name: Inspect
        run: docker buildx imagetools inspect ${{ inputs.image }}:${{ steps.get-version.outputs.version }}

  scan-images:
    name: Scan images
    needs: merge-manifests
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PAT_TOKEN }}

      - name: Trivy — warn on CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ inputs.image }}:${{ needs.merge-manifests.outputs.version }}'
          format: table
          exit-code: '0'
          severity: CRITICAL

      - name: Trivy — warn on HIGH
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ inputs.image }}:${{ needs.merge-manifests.outputs.version }}'
          format: table
          exit-code: '0'
          severity: HIGH

  notify-tg-result:
    name: Notify Telegram about build result
    runs-on: ubuntu-latest
    needs: [merge-manifests, scan-images]
    if: always() # Ensures notifications send even if previous steps fail
    steps:
      - name: Send Telegram message with result status
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message_thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          format: html
          message: |
            ${{ (needs.merge-manifests.result == 'success' && needs.scan-images.result == 'success') && '✅ <b>Build Finished Successfully</b>' || '❌ <b>Build Failed</b>' }}

            <b>Service:</b> ${{ inputs.display_name }}
            <b>Trigger:</b> ${{ github.event_name }}
            <b>Repository:</b> ${{ inputs.repo }}

            <b>Pipeline Details:</b>
            • Manifest Merge: ${{ needs.merge-manifests.result }}
            • Security Scan: ${{ needs.scan-images.result }}
            • Image build: ${{ needs.merge-manifests.result }}

            🔗 <a href="https://github.com/${{ inputs.repo }}/actions/runs/${{ github.run_id }}">View Workflow Run</a>                