name: Docker build & push (template)

on:
  workflow_call:
    inputs:
      repo:
        description: 'org/repo to build, e.g. amster2k2x/remnawave-node'
        required: true
        type: string
      display_name:
        description: 'Used in Telegram notification titles, e.g. "Remnawave Node"'
        required: true
        type: string
      image:
        required: true
        type: string
      dockerhub_image:
        required: true
        type: string
      version_file:
        required: false
        type: string
        default: package.json
      version_source:
        description: '"jq" for package.json (default) or "toml" for pyproject.toml'
        required: false
        type: string
        default: jq
      version_jq_path:
        required: false
        type: string
        default: .version
      dockerfile:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: Dockerfile
      build_args:
        description: 'Extra docker build-args, one KEY=VALUE per line'
        required: false
        type: string
        default: ''
      gitleaks_allowlist:
        description: 'Extra [allowlist] block content for .gitleaks.toml. Empty = use action defaults only.'
        required: false
        type: string
        default: ''
      matrix_json:
        description: 'JSON array of {platform, runner} build targets'
        required: false
        type: string
        default: '[{"platform":"linux/amd64","runner":"ubuntu-latest"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]'
      needs_frontend_artifact:
        required: false
        type: boolean
        default: false
      frontend_artifact_name:
        required: false
        type: string
        default: frontend-dist
      frontend_artifact_path:
        required: false
        type: string
        default: frontend/dist

permissions:
  contents: read

jobs:
  notify-tg-start:
    name: Notify Telegram about build start
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repo }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Send Telegram message with info status
        uses: proDreams/actions-telegram-notifier@main
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          status: info
          notify_fields: 'repository,branch,commit,workflow'
          title: 'Build started — ${{ inputs.display_name }}'

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repo }}
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 1          # Optimized: Only scan the latest commit to save time
          persist-credentials: false

      - name: Create Gitleaks Config Allowlist
        if: inputs.gitleaks_allowlist != ''
        run: |
          cat << 'EOF' > .gitleaks.toml
          [extend]
          useDefault = true

          [allowlist]
          ${{ inputs.gitleaks_allowlist }}
          EOF

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  build-images:
    name: Build ${{ matrix.platform }}
    needs: secret-scan
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix_json) }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repo }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Download frontend build artifact
        if: inputs.needs_frontend_artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.frontend_artifact_name }}
          path: ${{ inputs.frontend_artifact_path }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PAT_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          build-args: ${{ inputs.build_args }}
          outputs: |
            type=image,"name=${{ inputs.image }},${{ inputs.dockerhub_image }}",push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-manifests:
    name: Merge & push manifests
    needs: build-images
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repo }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Extract package version
        id: get-version
        run: |
          if [ "${{ inputs.version_source }}" = "toml" ]; then
            VERSION=$(grep "^version" ${{ inputs.version_file }} | awk -F'"' '{print $2}')
          else
            VERSION=$(jq -r '${{ inputs.version_jq_path }}' ${{ inputs.version_file }})
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PAT_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ inputs.image }}
            ${{ inputs.dockerhub_image }}
          tags: |
            type=raw,value=${{ steps.get-version.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Create and push manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(echo "${{ steps.meta.outputs.tags }}" | sed 's/^/-t /') \
            $(printf '${{ inputs.dockerhub_image }}@sha256:%s ' *)

          docker buildx imagetools create \
            $(echo "${{ steps.meta.outputs.tags }}" | sed 's/^/-t /') \
            $(printf '${{ inputs.image }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect ${{ inputs.image }}:${{ steps.get-version.outputs.version }}

  scan-images:
    name: Scan images
    needs: merge-manifests
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PAT_TOKEN }}

      - name: Trivy — warn on CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ inputs.image }}:${{ needs.merge-manifests.outputs.version }}'
          format: table
          exit-code: '0'
          severity: CRITICAL

      - name: Trivy — warn on HIGH
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ inputs.image }}:${{ needs.merge-manifests.outputs.version }}'
          format: table
          exit-code: '0'
          severity: HIGH

  notify-tg-result:
    name: Notify Telegram about build result
    runs-on: ubuntu-latest
    needs: [merge-manifests, scan-images]
    if: always()
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repo }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Send Telegram message with result status
        uses: proDreams/actions-telegram-notifier@main
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          status: ${{ (needs.merge-manifests.result == 'success' && needs.scan-images.result == 'success') && 'success' || 'error' }}
          notify_fields: 'repository,branch,commit,workflow'
          title: ${{ (needs.merge-manifests.result == 'success' && needs.scan-images.result == 'success') && format('Build finished — {0}', inputs.display_name) || format('Build failed — {0}', inputs.display_name) }}