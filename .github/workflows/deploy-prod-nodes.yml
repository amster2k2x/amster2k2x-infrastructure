name: Deploy Nodes to Prod (rolling)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy'
        required: false
        default: 'latest'
  workflow_call:
    inputs:
      image_tag:
        required: false
        type: string
        default: 'latest'

permissions:
  contents: read

jobs:
  notify-start:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message_thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          format: html
          message: |
            🔄 <b>Node Fleet Deploy Started</b>
            <b>Strategy:</b> Rolling (max-parallel: 2)
            <b>Tag:</b> <code>${{ inputs.image_tag || 'latest' }}</code>

  deploy-node:
    needs: notify-start
    runs-on: ubuntu-latest
    environment: prod        # ← triggers approval gate + scopes secrets
    timeout-minutes: 10
    strategy:
      fail-fast: true        # one node failing doesn't cancel the rest
      max-parallel: 2         # rolling — two nodes at a time
      matrix:
        include:
          - node: node-01
            host_secret: PROD_NODE_01_HOST
          - node: node-02
            host_secret: PROD_NODE_02_HOST
    steps:
      - name: Install SSH key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Add host to known_hosts
        run: ssh-keyscan -T 10 -H ${{ secrets[matrix.host_secret] }} >> ~/.ssh/known_hosts

      - name: Deploy ${{ matrix.node }}
        run: |
          ssh deploy@${{ secrets[matrix.host_secret] }} \
            "cd /opt/remnanode && \
             export IMAGE_TAG=${{ inputs.image_tag }} && \
             docker compose pull remnanode && \
             docker compose up -d --no-deps --force-recreate remnanode"

  notify-result:
    runs-on: ubuntu-latest
    needs: deploy-node
    if: always()
    steps:
      - uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message_thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          format: html
          message: |
            ${{ contains(needs.deploy-node.result, 'failure') && '❌ <b>Node Fleet Deploy — Some Nodes Failed</b>' || '✅ <b>Node Fleet Deploy Succeeded</b>' }}
            <b>Tag:</b> <code>${{ inputs.image_tag || 'latest' }}</code>
            🔗 <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Run</a>