name: Deploy Nodes to Prod (rolling)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy'
        required: false
        default: 'latest'
  workflow_call:
    inputs:
      image_tag:
        required: false
        type: string
        default: 'latest'

permissions:
  contents: read

jobs:
  notify-start:
    runs-on: self-hosted
    steps:
      - uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message_thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          format: html
          message: |
            🔄 <b>Node Fleet Deploy Started</b>
            <b>Strategy:</b> Rolling (max-parallel: 2)
            <b>Tag:</b> <code>${{ inputs.image_tag || 'latest' }}</code>

  deploy-node:
    needs: notify-start
    runs-on: self-hosted
    environment: prod
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - node: node-01
            host_secret: PROD_NODE_01_HOST
          - node: node-02
            host_secret: PROD_NODE_02_HOST
          - node: node-03
            host_secret: PROD_NODE_03_HOST
          - node: node-04
            host_secret: PROD_NODE_04_HOST
          - node: node-05
            host_secret: PROD_NODE_05_HOST
          - node: node-06
            host_secret: PROD_NODE_06_HOST
          - node: node-07
            host_secret: PROD_NODE_07_HOST
          - node: node-08
            host_secret: PROD_NODE_08_HOST
          - node: node-09
            host_secret: PROD_NODE_09_HOST
          - node: node-10
            host_secret: PROD_NODE_10_HOST
    steps:
      - name: Install SSH key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Add host to known_hosts
        run: ssh-keyscan -T 10 -H ${{ secrets[matrix.host_secret] }} >> ~/.ssh/known_hosts

      - name: Deploy ${{ matrix.node }}
        id: deploy
        run: |
          ssh deploy@${{ secrets[matrix.host_secret] }} \
            "cd /opt/remnanode && \
             export IMAGE_TAG=${{ inputs.image_tag }} && \
             docker compose pull remnanode && \
             docker compose up -d --no-deps --force-recreate remnanode"

      - name: Record result
        if: always()
        run: |
          mkdir -p /tmp/node-results
          echo "${{ matrix.host_secret }}:${{ steps.deploy.outcome }}" > /tmp/node-results/result.txt

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-result-${{ matrix.node }}
          path: /tmp/node-results/result.txt
          retention-days: 1

  notify-result:
    runs-on: self-hosted
    needs: deploy-node
    if: always()
    steps:
      - name: Download all node results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: node-results
          pattern: node-result-*
          merge-multiple: true

      - name: Build success/failure lists
        id: summarize
        run: |
          SUCCESS=""
          FAILED=""
          for f in node-results/*.txt; do
            NAME=$(cut -d: -f1 "$f")
            STATUS=$(cut -d: -f2 "$f")
            if [ "$STATUS" = "success" ]; then
              SUCCESS="${SUCCESS}✅ ${NAME}
          "
            else
              FAILED="${FAILED}❌ ${NAME} (${STATUS})
          "
            fi
          done
          [ -z "$SUCCESS" ] && SUCCESS="(none)"
          [ -z "$FAILED" ] && FAILED="(none)"

          {
            echo "success_list<<EOF"
            echo "$SUCCESS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "failed_list<<EOF"
            echo "$FAILED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message_thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          format: html
          message: |
            ${{ contains(needs.deploy-node.result, 'failure') && '❌ <b>Node Fleet Deploy — Some Nodes Failed</b>' || '✅ <b>Node Fleet Deploy Succeeded</b>' }}
            <b>Tag:</b> <code>${{ inputs.image_tag || 'latest' }}</code>

            <b>Succeeded:</b>
            <pre>${{ steps.summarize.outputs.success_list }}</pre>

            <b>Failed:</b>
            <pre>${{ steps.summarize.outputs.failed_list }}</pre>

            🔗 <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Run</a>