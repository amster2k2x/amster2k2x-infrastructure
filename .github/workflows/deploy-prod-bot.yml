name: Deploy Bot + Cabinet to Prod (blue-green)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Bot image tag to deploy'
        required: false
        default: 'latest'
      cabinet_tag:
        description: 'Cabinet image tag to deploy'
        required: false
        default: 'latest'
  workflow_call:
    inputs:
      image_tag:
        required: false
        type: string
        default: 'latest'
      cabinet_tag:
        required: false
        type: string
        default: 'latest'

permissions:
  contents: read

jobs:
  # Bot worker blue-green
  deploy-bot:
    uses: ./.github/workflows/deploy-prod-apps-template.yml
    with:
      ssh_host_secret: PROD_BOT_VPS_HOST
      service_name: remnawave-bot
      display_name: Bedolaga Bot Worker
      compose_file: docker-compose.yml
      deploy_dir: /opt
      container_port: '8080'
      blue_port: '8080'
      green_port: '8081'
      health_path: '/health'
      nginx_config_path: /opt/nginx/nginx.conf
      image_tag: ${{ inputs.image_tag || 'latest' }}
    secrets: 
      # health_header passed via secret — see note below
      health_header: 'X-API-Key: ${{ secrets.WEB_API_DEFAULT_TOKEN }}'
      inherit: true

  # Cabinet (bot-account) blue-green — runs after bot succeeds
  deploy-cabinet:
    needs: deploy-bot
    uses: ./.github/workflows/deploy-prod-apps-template.yml
    with:
      ssh_host_secret: PROD_BOT_VPS_HOST
      service_name: remnawave-bot-account
      display_name: Bedolaga Cabinet (MiniApp)
      compose_file: docker-compose.yml
      deploy_dir: /opt
      container_port: '80'
      blue_port: '4080'
      green_port: '4081'
      health_path: '/'
      nginx_config_path: /opt/nginx/nginx.conf
      image_tag: ${{ inputs.cabinet_tag || 'latest' }}
    secrets: inherit