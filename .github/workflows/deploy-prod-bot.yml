name: Deploy Bot + Cabinet to Prod (blue-green)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy'
        required: false
        default: 'latest'
      cabinet_tag:
        description: 'Cabinet image tag to deploy'
        required: false
        default: 'latest'
  workflow_call:
    inputs:
      image_tag:
        required: false
        type: string
        default: 'latest'
      cabinet_tag:
        required: false
        type: string
        default: 'latest'

permissions:
  contents: read

jobs:
  # Bot worker blue-green
  deploy-bot:
    uses: ./.github/workflows/deploy-prod-apps-template.yml
    with:
      ssh_host_secret: PROD_BOT_VPS_HOST
      service_name: remnawave-bot
      display_name: Bedolaga Bot Worker
      compose_file: docker-compose.yml
      deploy_dir: /opt/bot
      container_port: '8080'
      blue_port: '8080'
      green_port: '8081'
      health_path: '/health'
      nginx_config_path: /opt/nginx/nginx.conf
      image_tag: ${{ inputs.image_tag || 'latest' }}
    secrets: inherit

  register-webhook:
    runs-on: ubuntu-latest
    needs: deploy-bot          # runs only after bot deploy fully completes
    if: needs.deploy-bot.result == 'success'   # skip if deploy failed/rolled back
    steps:
      - name: Re-register Telegram webhook
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/setWebhook" \
            -d "url=https://${{ vars.TELEGRAM_BOT_DOMAIN }}/webhook" \
            | jq -e '.ok == true' || { echo "CRITICAL: webhook not registered"; exit 1; }

      - name: Verify webhook registered
        run: |
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/getWebhookInfo" \
            | jq -e '.result.url | test("^https://")'

  # Cabinet (bot-account) blue-green — runs after bot succeeds
  deploy-cabinet:
    needs: deploy-bot
    uses: ./.github/workflows/deploy-prod-apps-template.yml
    with:
      ssh_host_secret: PROD_BOT_VPS_HOST
      service_name: remnawave-bot-account
      display_name: Bedolaga Cabinet
      compose_file: docker-compose.yml
      deploy_dir: /opt/bot-cabinet
      container_port: '80'
      blue_port: '4080'
      green_port: '4081'
      health_path: '/'
      nginx_config_path: /opt/nginx/nginx.conf
      image_tag: ${{ inputs.cabinet_tag || 'latest' }}
    secrets: inherit