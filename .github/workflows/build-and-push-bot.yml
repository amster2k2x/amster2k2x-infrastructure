name: Build bot (reusable)

on:
  workflow_call:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build:
    uses: ./.github/workflows/build-and-push-template.yml
    with:
      repo: amster2k2x/remnawave-bedolaga-telegram-bot
      display_name: bot
      image: ghcr.io/amster2k2x/remnawave-bedolaga-telegram-bot
      dockerhub_image: sammosdev/remnawave-bedolaga-telegram-bot
      version_file: pyproject.toml
      version_source: toml
      gitleaks_allowlist: |
        paths = [
          '''^docs/''',
          '''^tests/''',
          '''^README\.md$''',
          '''^\.env\.example$'''
        ]
    secrets: inherit