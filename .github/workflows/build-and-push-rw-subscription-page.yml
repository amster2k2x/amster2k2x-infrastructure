name: Build Remnawave Subscription Page (reusable)

on:
  workflow_call:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: amster2k2x/remnawave-subscription-page
          token: ${{ secrets.PAT_TOKEN }}
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run start:build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  build:
    needs: build-frontend
    uses: ./.github/workflows/build-and-push-template.yml
    with:
      repo: amster2k2x/remnawave-subscription-page
      display_name: subscription page
      image: ghcr.io/amster2k2x/remnawave-subscription-page
      dockerhub_image: sammosdev/remnawave-subscription-page
      version_file: backend/package.json
      needs_frontend_artifact: true
    secrets: inherit